<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saravana Steel Company - Billing</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f7;
  color:#222;
}
header{
  height:72px;
  background:#0b1730;
  color:#fff;
  padding:14px 25px;
}
header h1{margin:0;font-size:21px}
header p{margin:4px 0 0;font-size:12px}

nav{
  height:48px;
  background:#fff;
  display:flex;
  border-bottom:1px solid #ccc;
}
nav button{
  border:0;
  background:#fff;
  padding:0 25px;
  font-weight:bold;
  cursor:pointer;
}
nav button.active{
  border-bottom:3px solid #0b1730;
  color:#0b1730;
}

.page{
  display:none;
  width:96%;
  max-width:1250px;
  margin:auto;
  padding:12px 0;
}
.page.active{display:block}

.topLine{
  display:flex;
  gap:15px;
  align-items:end;
  background:#fff;
  padding:10px 15px;
  border:1px solid #ddd;
}
.topLine .no{flex:1}
.topLine .date{width:280px}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:4px;
}
input,select{
  width:100%;
  height:38px;
  border:1px solid #bbb;
  padding:7px 10px;
  font-size:14px;
  background:#fff;
}
input:focus,select:focus{
  outline:2px solid #b7c8ed;
}

.entry{
  background:#fff;
  margin-top:10px;
  border:1px solid #ddd;
  padding:10px 15px;
}

.entryTitle{
  font-weight:bold;
  margin-bottom:7px;
}

.entryGrid{
  display:grid;
  grid-template-columns:minmax(300px,1fr) 110px 110px 130px 120px;
  gap:8px;
  align-items:end;
}

.searchBox{position:relative}

.results{
  position:absolute;
  left:0;
  right:0;
  top:100%;
  background:#fff;
  border:1px solid #999;
  z-index:100;
  max-height:220px;
  overflow-y:auto;
  box-shadow:0 4px 10px #9995;
}

.result{
  padding:9px 10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
}
.result:hover,
.result.selectedResult{
  background:#e9eef9;
}
.result small{color:#666}

.amountBox{
  text-align:right;
  font-size:13px;
  font-weight:bold;
  margin-top:7px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  margin-top:10px;
}
th,td{
  border:1px solid #ccc;
  padding:7px 8px;
  font-size:13px;
}
th{
  background:#dce9df;
  text-align:left;
}
td.num,th.num{text-align:right}
.removeBtn{
  background:#dc3545;
  color:#fff;
  border:0;
  padding:5px 10px;
  cursor:pointer;
  border-radius:3px;
}

.bottomArea{
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin-top:10px;
}
.hint{
  color:#777;
  font-size:12px;
  padding:10px 0;
}

.summary{
  width:360px;
  background:#fff;
  border:1px solid #ccc;
  padding:10px 15px;
}
.sumRow{
  display:flex;
  justify-content:space-between;
  padding:5px 0;
}
.grand{
  border-top:2px solid #222;
  margin-top:5px;
  padding-top:9px;
  font-size:19px;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:10px;
}
.btn{
  border:0;
  padding:10px 17px;
  border-radius:4px;
  font-weight:bold;
  cursor:pointer;
}
.primary{background:#0b1730;color:#fff}
.green{background:#198754;color:#fff}
.blue{background:#1769aa;color:#fff}
.gray{background:#ddd;color:#222}
.red{background:#dc3545;color:#fff}

.list{
  background:#fff;
  border:1px solid #ddd;
  margin-top:10px;
}
.listRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 14px;
  border-bottom:1px solid #ddd;
}
.listRow:last-child{border-bottom:0}
.listActions{
  display:flex;
  gap:6px;
}

.productsBox{
  background:#fff;
  border:1px solid #ddd;
  padding:15px;
}
.productForm{
  display:grid;
  grid-template-columns:1fr 180px 140px;
  gap:10px;
  align-items:end;
}
.productItem{
  display:flex;
  justify-content:space-between;
  padding:9px;
  border-bottom:1px solid #ddd;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:500;
  align-items:center;
  justify-content:center;
}
.modal.show{display:flex}
.modalBox{
  background:#fff;
  width:800px;
  max-width:94%;
  max-height:90vh;
  overflow:auto;
  padding:25px;
}
.billHeader{
  text-align:center;
  border-bottom:2px solid #222;
  padding-bottom:10px;
}
.billHeader h2{margin:0}
.billHeader p{margin:4px}
.billInfo{
  display:flex;
  justify-content:space-between;
  margin:15px 0;
}
.billTotal{
  margin-left:auto;
  width:350px;
  margin-top:15px;
}
.billGrand{
  border-top:2px solid #222;
  padding-top:8px;
  font-size:20px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
}

@media(max-width:800px){
  .entryGrid{
    grid-template-columns:1fr 100px 100px;
  }
  .entryGrid .rateCol{grid-column:1}
  .entryGrid .amountCol{grid-column:2/4}
  .topLine{flex-direction:column}
  .topLine .date{width:100%}
  .bottomArea{flex-direction:column}
  .summary{width:100%}
  .productForm{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <h1>Saravana Steel Company</h1>
  <p>Estimate & Billing</p>
</header>

<nav>
  <button id="billingNav" class="active" onclick="showPage('billing')">🧾 Billing</button>
  <button id="productsNav" onclick="showPage('products')">📦 Products</button>
  <button id="estimatesNav" onclick="showPage('estimates')">📋 Estimates</button>
</nav>


<!-- ================= BILLING ================= -->

<section id="billing" class="page active">

  <div class="topLine">

    <div class="no">
      <label>ESTIMATE &nbsp; Estimate No.</label>
      <input id="estimateNo" readonly>
    </div>

    <div class="date">
      <label>Date</label>
      <input id="estimateDate" type="date">
    </div>

  </div>


  <div class="entry">

    <div class="entryTitle">＋ Add Product</div>

    <div class="entryGrid">

      <div class="searchBox">
        <label>Product</label>

        <input
          id="productSearch"
          placeholder="Search / select product..."
          autocomplete="off">

        <div id="productResults" class="results" style="display:none"></div>
      </div>


      <div>
        <label>Unit</label>
        <input id="unit" readonly value="-">
      </div>


      <div>
        <label>Qty</label>
        <input
          id="qty"
          type="number"
          min="0"
          step="0.01"
          placeholder="Qty">
      </div>


      <div class="rateCol">
        <label>Rate</label>
        <input
          id="rate"
          type="number"
          min="0"
          step="0.01"
          placeholder="Rate → Enter">
      </div>


      <div class="amountCol">
        <label>Amount</label>
        <div class="amountBox">
          ₹<span id="liveAmount">0.00</span>
        </div>
      </div>

    </div>

  </div>


  <!-- BILL TABLE -->

  <table>

    <thead>
      <tr>
        <th style="width:55px">S.No</th>
        <th>Product</th>
        <th class="num">Qty</th>
        <th>Unit</th>
        <th class="num">Rate</th>
        <th class="num">Amount</th>
        <th style="width:70px"></th>
      </tr>
    </thead>

    <tbody id="items"></tbody>

  </table>


  <div class="bottomArea">

    <div class="hint">
      ← Product select → Qty → <b>ENTER</b> → Rate → <b>ENTER</b>
    </div>


    <div class="summary">

      <div class="sumRow">
        <span>Subtotal</span>
        <strong>₹<span id="subtotal">0.00</span></strong>
      </div>

      <div class="sumRow">
        <label style="margin:0">Discount</label>
        <input
          id="discount"
          type="number"
          min="0"
          value="0"
          style="width:120px;height:30px;text-align:right">
      </div>

      <div class="sumRow">
        <span>Discount</span>
        <strong>₹<span id="discountView">0.00</span></strong>
      </div>

      <div class="sumRow grand">
        <span>Grand Total</span>
        <span>₹<span id="grandTotal">0.00</span></span>
      </div>

    </div>

  </div>


  <div class="buttons">

    <button class="btn green" onclick="saveEstimate()">
      💾 Save Estimate
    </button>

    <button class="btn blue" onclick="viewCurrentBill()">
      👁 View Estimate
    </button>

    <button class="btn primary" onclick="printCurrentBill()">
      🖨 Print
    </button>

    <button class="btn gray" onclick="newEstimate()">
      ＋ New
    </button>

  </div>

</section>


<!-- ================= PRODUCTS ================= -->

<section id="products" class="page">

  <div class="productsBox">

    <h2>📦 Products</h2>

    <div class="productForm">

      <div>
        <label>Product Name</label>
        <input id="newProductName" placeholder="Example: Ultratech PPC">
      </div>

      <div>
        <label>Unit</label>
        <select id="newProductUnit">
          <option value="">Select Unit</option>
          <option>Bag</option>
          <option>Nos</option>
          <option>Kg</option>
          <option>Ton</option>
          <option>Litre</option>
          <option>Piece</option>
          <option>Box</option>
          <option>Meter</option>
        </select>
      </div>

      <button class="btn green" onclick="saveProduct()">
        💾 Save Product
      </button>

    </div>

    <input
      id="productListSearch"
      placeholder="🔎 Search products..."
      style="margin-top:15px"
      oninput="renderProducts()">

    <div id="productList"></div>

  </div>

</section>


<!-- ================= ESTIMATES ================= -->

<section id="estimates" class="page">

  <div class="productsBox">

    <h2>📋 Saved Estimates</h2>

    <input
      id="estimateSearch"
      placeholder="🔎 Search estimate..."
      oninput="renderEstimates()">

    <div id="estimateList" class="list"></div>

  </div>

</section>


<!-- ================= VIEW BILL ================= -->

<div id="billModal" class="modal">

  <div class="modalBox">

    <div id="billPreview"></div>

    <div class="buttons">

      <button class="btn primary" onclick="printCurrentBill()">
        🖨 Print
      </button>

      <button class="btn gray" onclick="closeBill()">
        Close
      </button>

    </div>

  </div>

</div>


<script>

/* ================= STORAGE ================= */

const PRODUCT_KEY = "saravana_products_v2";
const OLD_PRODUCT_KEY = "saravana_products_v1";
const ESTIMATE_KEY = "saravana_estimates_v5";

let products = [];
let estimates = [];
let billItems = [];
let editingEstimate = null;

let selectedProduct = null;
let keyboardIndex = -1;


/* ================= LOAD ================= */

function loadData(){

  try{

    const saved = localStorage.getItem(PRODUCT_KEY);

    if(saved){

      products = JSON.parse(saved);

    }else{

      const old = localStorage.getItem(OLD_PRODUCT_KEY);

      if(old){

        products = JSON.parse(old).map((p,i)=>{

          if(typeof p === "string"){

            return {
              id:"p_"+Date.now()+"_"+i,
              name:p,
              unit:"Nos"
            };

          }

          return {
            id:p.id || "p_"+Date.now()+"_"+i,
            name:p.name || "",
            unit:p.unit || "Nos"
          };

        });

        saveProducts();

      }

    }

  }catch(e){

    products=[];

  }


  try{

    estimates =
      JSON.parse(
        localStorage.getItem(ESTIMATE_KEY) || "[]"
      );

  }catch(e){

    estimates=[];

  }

}


/* ================= SAVE ================= */

function saveProducts(){

  localStorage.setItem(
    PRODUCT_KEY,
    JSON.stringify(products)
  );

}


function saveEstimates(){

  localStorage.setItem(
    ESTIMATE_KEY,
    JSON.stringify(estimates)
  );

}


/* ================= PAGE ================= */

function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(x=>x.classList.remove("active"));

  document
    .getElementById(page)
    .classList.add("active");

  document
    .querySelectorAll("nav button")
    .forEach(x=>x.classList.remove("active"));

  if(page==="billing")
    billingNav.classList.add("active");

  if(page==="products"){

    productsNav.classList.add("active");

    renderProducts();

  }

  if(page==="estimates"){

    estimatesNav.classList.add("active");

    renderEstimates();

  }

}


/* ================= DATE ================= */

function today(){

  const d=new Date();

  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");

}


/* ================= ESTIMATE NUMBER ================= */

function nextEstimateNumber(){

  let max=0;

  estimates.forEach(e=>{

    const m=String(e.number||"").match(/(\d+)$/);

    if(m)
      max=Math.max(max,parseInt(m[1]));

  });

  return "EST-"+String(max+1).padStart(3,"0");

}


/* ================= NEW ESTIMATE ================= */

function newEstimate(){

  editingEstimate=null;

  billItems=[];
  selectedProduct=null;
  keyboardIndex=-1;

  estimateNo.value=nextEstimateNumber();
  estimateDate.value=today();

  productSearch.value="";
  unit.value="-";
  qty.value="";
  rate.value="";
  discount.value="0";

  liveAmount.textContent="0.00";

  closeProductResults();

  renderItems();

  productSearch.focus();

}


/* ================= PRODUCT SEARCH ================= */

function searchProducts(){

  const text=
    productSearch.value.trim().toLowerCase();

  if(!text){

    closeProductResults();

    return;

  }

  const list=products.filter(p=>
    p.name.toLowerCase().includes(text)
  );

  keyboardIndex=-1;

  if(!list.length){

    productResults.innerHTML=
      `<div class="result">No product found</div>`;

  }else{

    productResults.innerHTML=
      list.slice(0,30).map((p,i)=>`

        <div
          class="result"
          data-id="${p.id}"
          data-index="${i}">

          <span>
            <strong>${escapeHTML(p.name)}</strong>
          </span>

          <small>${escapeHTML(p.unit)}</small>

        </div>

      `).join("");

  }

  productResults.style.display="block";

}


/* ================= CLOSE PRODUCT LIST ================= */

function closeProductResults(){

  productResults.style.display="none";
  keyboardIndex=-1;

}


/* ================= SELECT PRODUCT ================= */

function selectProduct(id){

  const p=products.find(x=>x.id===id);

  if(!p)return;

  selectedProduct=p;

  productSearch.value=p.name;
  unit.value=p.unit;

  closeProductResults();

  qty.focus();

}


/* ================= PRODUCT RESULT CLICK ================= */

productResults.addEventListener(
  "click",
  function(e){

    const row=e.target.closest(".result");

    if(!row)return;

    const id=row.dataset.id;

    if(id)
      selectProduct(id);

  }
);


/* ================= PRODUCT KEYBOARD ================= */

productSearch.addEventListener(
  "keydown",
  function(e){

    const rows=[
      ...productResults.querySelectorAll(".result[data-id]")
    ];

    if(e.key==="ArrowDown"){

      if(productResults.style.display==="none")
        return;

      e.preventDefault();

      keyboardIndex=
        Math.min(
          keyboardIndex+1,
          rows.length-1
        );

      highlightProduct(rows);

      return;

    }


    if(e.key==="ArrowUp"){

      if(productResults.style.display==="none")
        return;

      e.preventDefault();

      keyboardIndex=
        Math.max(
          keyboardIndex-1,
          0
        );

      highlightProduct(rows);

      return;

    }


    if(e.key==="Enter"){

      e.preventDefault();

      if(rows.length){

        const index=
          keyboardIndex<0 ? 0 : keyboardIndex;

        selectProduct(
          rows[index].dataset.id
        );

      }

    }

  }
);


function highlightProduct(rows){

  rows.forEach(x=>
    x.classList.remove("selectedResult")
  );

  if(rows[keyboardIndex]){

    rows[keyboardIndex]
      .classList.add("selectedResult");

    rows[keyboardIndex]
      .scrollIntoView({block:"nearest"});

  }

}


/* ================= QTY ENTER ================= */

qty.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      e.preventDefault();

      rate.focus();

      rate.select();

    }

  }
);


/* ================= RATE ================= */

rate.addEventListener(
  "input",
  liveCalculate
);

qty.addEventListener(
  "input",
  liveCalculate
);


rate.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      e.preventDefault();

      addItem();

    }

  }
);


function liveCalculate(){

  const q=parseFloat(qty.value)||0;
  const r=parseFloat(rate.value)||0;

  liveAmount.textContent=
    (q*r).toFixed(2);

}


/* ================= ADD ITEM ================= */

function addItem(){

  if(!selectedProduct){

    alert("Please select a product");

    productSearch.focus();

    return;

  }

  const q=parseFloat(qty.value);
  const r=parseFloat(rate.value);

  if(!q || q<=0){

    alert("Please enter quantity");

    qty.focus();

    return;

  }

  if(isNaN(r) || r<0){

    alert("Please enter rate");

    rate.focus();

    return;

  }

  billItems.push({

    productId:selectedProduct.id,
    product:selectedProduct.name,
    unit:selectedProduct.unit,
    qty:q,
    rate:r,
    amount:q*r

  });


  renderItems();


  selectedProduct=null;

  productSearch.value="";
  unit.value="-";
  qty.value="";
  rate.value="";

  liveAmount.textContent="0.00";

  closeProductResults();

  productSearch.focus();

}


/* ================= RENDER ITEMS ================= */

function renderItems(){

  if(!billItems.length){

    items.innerHTML=
      `<tr>
        <td colspan="7" style="text-align:center;padding:30px;color:#777">
          No products added yet
        </td>
      </tr>`;

    calculateTotal();

    return;

  }


  items.innerHTML=
    billItems.map((x,i)=>`

      <tr>

        <td>${i+1}</td>

        <td>${escapeHTML(x.product)}</td>

        <td class="num">${x.qty}</td>

        <td>${escapeHTML(x.unit)}</td>

        <td class="num">
          ₹${Number(x.rate).toFixed(2)}
        </td>

        <td class="num">
          ₹${Number(x.amount).toFixed(2)}
        </td>

        <td>
          <button
            class="removeBtn"
            onclick="removeItem(${i})">
            ×
          </button>
        </td>

      </tr>

    `).join("");

  calculateTotal();

}


/* ================= REMOVE ================= */

function removeItem(i){

  billItems.splice(i,1);

  renderItems();

}


/* ================= TOTAL ================= */

function calculateTotal(){

  const sub=
    billItems.reduce(
      (sum,x)=>sum+Number(x.amount||0),
      0
    );

  let dis=parseFloat(discount.value)||0;

  if(dis<0)dis=0;
  if(dis>sub)dis=sub;

  const total=sub-dis;

  subtotal.textContent=sub.toFixed(2);
  discountView.textContent=dis.toFixed(2);
  grandTotal.textContent=total.toFixed(2);

}


discount.addEventListener(
  "input",
  calculateTotal
);


/* ================= SAVE ESTIMATE ================= */

function getCurrentBill(){

  const sub=
    billItems.reduce(
      (sum,x)=>sum+Number(x.amount||0),
      0
    );

  let dis=parseFloat(discount.value)||0;

  if(dis<0)dis=0;
  if(dis>sub)dis=sub;

  return {

    id:
      editingEstimate ||
      "e_"+Date.now(),

    number:
      estimateNo.value,

    date:
      estimateDate.value,

    items:
      billItems.map(x=>({...x})),

    subtotal:sub,
    discount:dis,
    total:sub-dis

  };

}


function saveEstimate(){

  if(!billItems.length){

    alert("Please add at least one product");

    productSearch.focus();

    return;

  }

  const bill=getCurrentBill();

  if(editingEstimate){

    const i=
      estimates.findIndex(
        x=>x.id===editingEstimate
      );

    if(i!==-1)
      estimates[i]=bill;

  }else{

    estimates.push(bill);

  }

  saveEstimates();

  editingEstimate=bill.id;

  alert("Estimate saved successfully");

  renderEstimates();

}


/* ================= BILL PREVIEW ================= */

function createBillHTML(bill){

  return `

    <div class="billHeader">

      <h2>Saravana Steel Company</h2>

      <p>
        No.7, New Goller Street,
        (Opp to Bus Stand) Alangayam - 635701
      </p>

      <p>📞 9943706320 / 7010795644</p>

      <h3>ESTIMATE</h3>

    </div>


    <div class="billInfo">

      <div>
        <b>Estimate No:</b>
        ${escapeHTML(bill.number)}
      </div>

      <div>
        <b>Date:</b>
        ${escapeHTML(bill.date)}
      </div>

    </div>


    <table>

      <thead>

        <tr>
          <th>S.No</th>
          <th>Product</th>
          <th class="num">Qty</th>
          <th>Unit</th>
          <th class="num">Rate</th>
          <th class="num">Amount</th>
        </tr>

      </thead>

      <tbody>

        ${(bill.items||[]).map((x,i)=>`

          <tr>

            <td>${i+1}</td>

            <td>${escapeHTML(x.product)}</td>

            <td class="num">${x.qty}</td>

            <td>${escapeHTML(x.unit)}</td>

            <td class="num">
              ₹${Number(x.rate).toFixed(2)}
            </td>

            <td class="num">
              ₹${Number(x.amount).toFixed(2)}
            </td>

          </tr>

        `).join("")}

      </tbody>

    </table>


    <div class="billTotal">

      <div class="sumRow">
        <span>Subtotal</span>
        <b>₹${Number(bill.subtotal).toFixed(2)}</b>
      </div>

      <div class="sumRow">
        <span>Discount</span>
        <b>₹${Number(bill.discount).toFixed(2)}</b>
      </div>

      <div class="billGrand">
        <span>Grand Total</span>
        <span>₹${Number(bill.total).toFixed(2)}</span>
      </div>

    </div>

  `;

}


/* ================= VIEW CURRENT ================= */

function viewCurrentBill(){

  if(!billItems.length){

    alert("Please add at least one product");

    return;

  }

  const bill=getCurrentBill();

  billPreview.innerHTML=createBillHTML(bill);

  billModal.classList.add("show");

}


/* ================= VIEW SAVED ================= */

function viewEstimate(id){

  const bill=
    estimates.find(
      x=>x.id===id
    );

  if(!bill)return;

  billPreview.innerHTML=createBillHTML(bill);

  billModal.classList.add("show");

}


/* ================= CLOSE BILL ================= */

function closeBill(){

  billModal.classList.remove("show");

}


/* ================= PRINT ================= */

function printCurrentBill(){

  let bill;

  if(editingEstimate){

    bill=getCurrentBill();

  }else{

    if(!billItems.length){

      alert("Please add products first");

      return;

    }

    bill=getCurrentBill();

  }

  const html=createBillHTML(bill);

  const w=window.open("","_blank");

  if(!w){

    alert("Please allow pop-ups for printing");

    return;

  }

  w.document.write(`

    <!DOCTYPE html>

    <html>

    <head>

      <title>${escapeHTML(bill.number)}</title>

      <style>

        body{
          font-family:Arial;
          margin:30px;
          color:#111;
        }

/* ================= ESTIMATES ================= */

function renderEstimates(){

  const text=
    estimateSearch.value
    .trim()
    .toLowerCase();

  const list=
    estimates
      .slice()
      .reverse()
      .filter(e=>
        String(e.number||"")
          .toLowerCase()
          .includes(text)
      );


  if(!list.length){

    estimateList.innerHTML=
      `<div style="padding:30px;text-align:center;color:#777">
        No saved estimates
      </div>`;

    return;

  }


  estimateList.innerHTML=
    list.map(e=>`

      <div class="listRow">

        <div>

          <b>${escapeHTML(e.number)}</b>

          <div style="font-size:12px;color:#777;margin-top:4px">

            ${escapeHTML(e.date||"")}
            &nbsp; | &nbsp;
            ${(e.items||[]).length} product(s)
            &nbsp; | &nbsp;
            ₹${Number(e.total||0).toFixed(2)}

          </div>

        </div>


        <div class="listActions">

          <button
            class="btn blue"
            onclick="viewEstimate('${e.id}')">

            👁 View

          </button>


          <button
            class="btn gray"
            onclick="editEstimate('${e.id}')">

            Edit

          </button>


          <button
            class="btn red"
            onclick="deleteEstimate('${e.id}')">

            Delete

          </button>

        </div>

      </div>

    `).join("");

}


/* ================= EDIT ESTIMATE ================= */

function editEstimate(id){

  const e=
    estimates.find(
      x=>x.id===id
    );

  if(!e)return;

  editingEstimate=e.id;

  estimateNo.value=e.number||"";
  estimateDate.value=e.date||today();

  billItems=(e.items||[]).map(x=>({

    productId:x.productId||"",
    product:x.product||"",
    unit:x.unit||"Nos",
    qty:Number(x.qty||0),
    rate:Number(x.rate||0),
    amount:Number(
      x.amount ??
      Number(x.qty||0)*Number(x.rate||0)
    )

  }));

  discount.value=e.discount||0;

  selectedProduct=null;

  productSearch.value="";
  unit.value="-";
  qty.value="";
  rate.value="";

  renderItems();

  showPage("billing");

  productSearch.focus();

}


/* ================= DELETE ESTIMATE ================= */

function deleteEstimate(id){

  const e=
    estimates.find(
      x=>x.id===id
    );

  if(!e)return;

  if(!confirm("Delete "+e.number+"?"))
    return;

  estimates=
    estimates.filter(
      x=>x.id!==id
    );

  saveEstimates();

  renderEstimates();

}


/* ================= PRODUCTS ================= */

function saveProduct(){

  const name=
    newProductName.value.trim();

  const u=
    newProductUnit.value;

  if(!name){

    alert("Please enter product name");

    newProductName.focus();

    return;

  }

  if(!u){

    alert("Please select unit");

    newProductUnit.focus();

    return;

  }

  const exists=
    products.some(
      p=>
        p.name.toLowerCase()===
        name.toLowerCase()
    );

  if(exists){

    alert("Product already exists");

    return;

  }

  products.push({

    id:"p_"+Date.now(),

    name:name,

    unit:u

  });

  saveProducts();

  newProductName.value="";
  newProductUnit.value="";

  renderProducts();

}


function renderProducts(){

  const text=
    productListSearch.value
      .trim()
      .toLowerCase();

  const list=
    products.filter(
      p=>
        p.name.toLowerCase().includes(text)
    );


  if(!list.length){

    productList.innerHTML=
      `<div style="padding:20px;color:#777">
        No products found
      </div>`;

    return;

  }


  productList.innerHTML=
    list.map(p=>`

      <div class="productItem">

        <div>
          <b>${escapeHTML(p.name)}</b>
          <span style="color:#777">
            &nbsp; (${escapeHTML(p.unit)})
          </span>
        </div>

        <div>

          <button
            class="btn gray"
            onclick="editProduct('${p.id}')">
            Edit
          </button>

          <button
            class="btn red"
            onclick="deleteProduct('${p.id}')">
            Delete
          </button>

        </div>

      </div>

    `).join("");

}


function editProduct(id){

  const p=
    products.find(
      x=>x.id===id
    );

  if(!p)return;

  const name=
    prompt("Product Name",p.name);

  if(name===null)return;

  const unitValue=
    prompt("Unit",p.unit);

  if(unitValue===null)return;

  if(!name.trim() || !unitValue.trim()){

    alert("Both fields are required");

    return;

  }

  p.name=name.trim();
  p.unit=unitValue.trim();

  saveProducts();

  renderProducts();

}


function deleteProduct(id){

  const p=
    products.find(
      x=>x.id===id
    );

  if(!p)return;

  if(!confirm("Delete "+p.name+"?"))
    return;

  products=
    products.filter(
      x=>x.id!==id
    );

  saveProducts();

  renderProducts();

}


/* ================= CLOSE DROPDOWN ================= */

document.addEventListener(
  "click",
  function(e){

    if(!e.target.closest(".searchBox")){

      closeProductResults();

    }

  }
);


/* ================= ESCAPE ================= */

function escapeHTML(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================= START ================= */

loadData();

estimateNo.value=nextEstimateNumber();
estimateDate.value=today();

renderItems();
renderProducts();
renderEstimates();

</script>
