<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Saravana Steel Company - Estimate</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#222;
  overflow-x:hidden;
}

header{
  background:#0b1730;
  color:white;
  padding:12px 25px;
  height:78px;
}

header h1{
  margin:0;
  font-size:20px;
}

header p{
  margin:4px 0 0;
  font-size:11px;
  line-height:1.4;
}

nav{
  height:48px;
  display:flex;
  background:white;
  border-bottom:1px solid #ccc;
}

nav button{
  border:0;
  background:white;
  padding:0 28px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

nav button.active{
  color:#0b1730;
  border-bottom:3px solid #0b1730;
}

.page{
  display:none;
  width:100%;
  padding:12px 18px;
}

.page.active{
  display:block;
}

/* =========================
   HOME
========================= */

.billHeader{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  align-items:end;
  border-bottom:1px solid #ccc;
  padding-bottom:10px;
}

.estimateTitle{
  font-size:16px;
  font-weight:bold;
}

.field label{
  display:block;
  font-size:11px;
  font-weight:bold;
  margin-bottom:4px;
}

input,select{
  width:100%;
  height:34px;
  border:1px solid #bbb;
  border-radius:4px;
  padding:7px 9px;
  font-size:13px;
  background:white;
}

.addTitle{
  margin-top:10px;
  font-size:14px;
  font-weight:bold;
}

.entryRow{
  display:grid;
  grid-template-columns:minmax(300px,1fr) 110px 110px 130px 100px;
  gap:8px;
  align-items:end;
  margin-top:5px;
}

.searchWrap{
  position:relative;
}

.results{
  position:absolute;
  left:0;
  right:0;
  top:100%;
  background:white;
  border:1px solid #aaa;
  z-index:9999;
  max-height:250px;
  overflow-y:auto;
  box-shadow:0 5px 12px rgba(0,0,0,.2);
}

.result{
  padding:9px 10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
  font-size:13px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.result:hover,
.result.keyboardActive{
  background:#e8eefb;
}

.result strong{
  font-weight:bold;
}

.result span{
  color:#666;
  font-size:12px;
}

.hidden{
  display:none !important;
}

.amountBox{
  height:34px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  font-size:13px;
  font-weight:bold;
}

.billTable{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  background:white;
  table-layout:fixed;
}

.billTable th{
  background:#dce8df;
  font-size:11px;
  text-align:left;
  padding:7px;
  border:1px solid #d0d0d0;
}

.billTable td{
  font-size:12px;
  padding:7px;
  border:1px solid #ddd;
  height:32px;
}

.billTable th:nth-child(1),
.billTable td:nth-child(1){
  width:45px;
  text-align:center;
}

.billTable th:nth-child(2){
  width:auto;
}

.billTable th:nth-child(3),
.billTable td:nth-child(3){
  width:90px;
  text-align:right;
}

.billTable th:nth-child(4),
.billTable td:nth-child(4){
  width:90px;
}

.billTable th:nth-child(5),
.billTable td:nth-child(5){
  width:110px;
  text-align:right;
}

.billTable th:nth-child(6),
.billTable td:nth-child(6){
  width:130px;
  text-align:right;
}

.noItems{
  text-align:center !important;
  color:#777;
  height:180px !important;
}

.removeBtn{
  border:0;
  background:#dc3545;
  color:white;
  border-radius:3px;
  padding:4px 8px;
  cursor:pointer;
}

.bottomArea{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:20px;
  margin-top:8px;
}

.hint{
  color:#777;
  font-size:11px;
  padding:10px 4px;
}

.summary{
  border-top:1px solid #bbb;
  padding-top:6px;
}

.summaryRow{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  font-size:13px;
}

.summaryRow input{
  width:100px;
  height:28px;
  text-align:right;
}

.grand{
  border-top:2px solid #222;
  margin-top:4px;
  padding-top:7px;
  font-size:18px;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:8px;
  margin-top:10px;
  align-items:center;
}

.btn{
  border:0;
  border-radius:4px;
  padding:9px 15px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.saveBtn{
  background:#198754;
  color:white;
}

.viewBtn{
  background:#0d6efd;
  color:white;
}

.printBtn{
  background:#343a40;
  color:white;
}

.newBtn{
  background:white;
  color:#222;
  border:1px solid #aaa;
}

/* =========================
   PRODUCTS / ESTIMATES
========================= */

.card{
  background:white;
  border:1px solid #ddd;
  padding:14px;
  margin-bottom:12px;
}

.card h2{
  margin:0 0 12px;
  font-size:17px;
}

.productForm{
  max-width:500px;
}

.primary{
  width:100%;
  height:36px;
  margin-top:10px;
  border:0;
  border-radius:4px;
  background:#0b1730;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.listItem{
  border:1px solid #ddd;
  padding:10px;
  margin-top:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.actions{
  display:flex;
  gap:6px;
}

.secondary{
  border:1px solid #aaa;
  background:#eee;
  padding:6px 10px;
  border-radius:4px;
  cursor:pointer;
}

.danger{
  border:0;
  background:#dc3545;
  color:white;
  padding:6px 10px;
  border-radius:4px;
  cursor:pointer;
}

.badge{
  background:#eef2ff;
  padding:4px 8px;
  border-radius:12px;
  font-size:11px;
  margin-right:8px;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

/* =========================
   BILL PREVIEW
========================= */

.previewOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  z-index:10000;
  overflow:auto;
}

.previewOverlay.show{
  display:block;
}

.previewBox{
  background:white;
  width:800px;
  max-width:94%;
  margin:25px auto;
  padding:25px;
}

.previewHeader{
  text-align:center;
  border-bottom:2px solid #222;
  padding-bottom:12px;
}

.previewHeader h1{
  margin:0;
  font-size:22px;
}

.previewHeader p{
  margin:5px 0;
  font-size:12px;
}

.previewInfo{
  display:flex;
  justify-content:space-between;
  margin:15px 0;
  font-size:13px;
}

.previewTable{
  width:100%;
  border-collapse:collapse;
}

.previewTable th,
.previewTable td{
  border:1px solid #aaa;
  padding:7px;
  font-size:12px;
}

.previewTable th{
  background:#eee;
}

.previewTotal{
  width:300px;
  margin-left:auto;
  margin-top:15px;
}

.previewTotal div{
  display:flex;
  justify-content:space-between;
  padding:5px;
}

.previewGrand{
  border-top:2px solid #222;
  font-size:17px;
  font-weight:bold;
}

.closePreview{
  background:#dc3545;
  color:white;
  border:0;
  padding:8px 15px;
  border-radius:4px;
  cursor:pointer;
  margin-bottom:12px;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

  body{
    min-height:100vh;
  }

  .page.active{
    min-height:calc(100vh - 126px);
  }

}

/* =========================
   PRINT
========================= */

@media print{

  body *{
    visibility:hidden;
  }

  #previewOverlay,
  #previewOverlay *{
    visibility:visible;
  }

  #previewOverlay{
    position:absolute;
    inset:0;
    background:white;
  }

  .previewBox{
    width:100%;
    max-width:none;
    margin:0;
  }

  .closePreview{
    display:none;
  }

}

</style>

</head>

<body>


<header>

  <h1>Saravana Steel Company</h1>

  <p>
    Estimate & Billing
  </p>

</header>


<nav>

  <button
    id="homeNav"
    class="active"
    onclick="showPage('home')">

    🧾 Billing

  </button>


  <button
    id="productsNav"
    onclick="showPage('products')">

    📦 Products

  </button>


  <button
    id="estimatesNav"
    onclick="showPage('estimates')">

    📋 Estimates

  </button>

</nav>


<!-- =====================================================
     HOME / BILLING
===================================================== -->

<section
  id="home"
  class="page active">


  <div class="billHeader">

    <div>

      <span class="estimateTitle">
        <u>ESTIMATE</u>
      </span>

      <span style="font-size:12px;margin-left:8px">
        Estimate No.
      </span>

      <input
        id="estimateNo"
        readonly
        style="width:170px;margin-left:5px">

    </div>


    <div class="field">

      <label>Date</label>

      <input
        id="estimateDate"
        type="date">

    </div>

  </div>


  <div class="addTitle">

    ＋ Add Product

  </div>


  <div class="entryRow">


    <!-- PRODUCT -->

    <div class="field">

      <label>Product</label>

      <div class="searchWrap">

        <input
          id="productSearch"
          placeholder="Search / select product..."
          autocomplete="off">

        <div
          id="productResults"
          class="results hidden">
        </div>

      </div>

    </div>


    <!-- UNIT -->

    <div class="field">

      <label>Unit</label>

      <input
        id="unit"
        readonly
        placeholder="-">

    </div>


    <!-- QTY -->

    <div class="field">

      <label>Qty</label>

      <input
        id="qty"
        type="number"
        min="0"
        step="0.01"
        placeholder="Qty">

    </div>


    <!-- RATE -->

    <div class="field">

      <label>Rate</label>

      <input
        id="rate"
        type="number"
        min="0"
        step="0.01"
        placeholder="Rate → Enter">

    </div>


    <!-- LIVE AMOUNT -->

    <div>

      <label>Amount</label>

      <div
        id="liveAmount"
        class="amountBox">

        ₹0.00

      </div>

    </div>

  </div>


  <!-- BILL TABLE -->

  <table class="billTable">

    <thead>

      <tr>

        <th>S.No</th>

        <th>Product</th>

        <th>Qty</th>

        <th>Unit</th>

        <th>Rate</th>

        <th>Amount</th>

      </tr>

    </thead>

    <tbody id="items">

      <tr>

        <td
          colspan="6"
          class="noItems">

          No products added yet

        </td>

      </tr>

    </tbody>

  </table>


  <!-- BOTTOM -->

  <div class="bottomArea">


    <div>

      <div class="hint">

        ← Product select → Qty → ENTER → Rate → ENTER

      </div>


      <div class="buttons">

        <button
          class="btn saveBtn"
          onclick="saveEstimate()">

          💾 Save Estimate

        </button>


        <button
          class="btn viewBtn"
          onclick="viewCurrentEstimate()">

          👁 View Estimate

        </button>


        <button
          class="btn printBtn"
          onclick="printCurrentEstimate()">

          🖨 Print

        </button>


        <button
          class="btn newBtn"
          onclick="newEstimate()">

          ＋ New

        </button>

      </div>

    </div>


    <div class="summary">


      <div class="summaryRow">

        <span>Subtotal</span>

        <strong>
          ₹<span id="subtotal">0.00</span>
        </strong>

      </div>


      <div class="summaryRow">

        <span>Discount</span>

        <input
          id="discount"
          type="number"
          min="0"
          step="0.01"
          value="0">

      </div>


      <div class="summaryRow">

        <span>Discount</span>

        <strong>
          ₹<span id="discountView">0.00</span>
        </strong>

      </div>


      <div class="summaryRow grand">

        <span>Grand Total</span>

        <span>
          ₹<span id="grandTotal">0.00</span>
        </span>

      </div>

    </div>

  </div>

</section>


<!-- =====================================================
     PRODUCTS
===================================================== -->

<section
  id="products"
  class="page">


  <div class="card">

    <h2>📦 New Product</h2>


    <div class="productForm">

      <label>Product Name</label>

      <input
        id="newProductName"
        placeholder="Example: Ultratech PPC">


      <label
        style="display:block;margin-top:10px">

        Unit

      </label>

      <select id="newProductUnit">

        <option value="">
          Select Unit
        </option>

        <option value="Nos">
          Nos
        </option>

        <option value="Kg">
          Kg
        </option>

        <option value="Ton">
          Ton
        </option>

        <option value="Bag">
          Bag
        </option>

        <option value="Litre">
          Litre
        </option>

        <option value="Piece">
          Piece
        </option>

        <option value="Box">
          Box
        </option>

        <option value="Meter">
          Meter
        </option>

      </select>


      <button
        class="primary"
        onclick="saveProduct()">

        💾 Save Product

      </button>

    </div>

  </div>


  <div class="card">

    <input
      id="productListSearch"
      placeholder="🔎 Search products..."
      oninput="renderProducts()">

    <div id="productList"></div>

  </div>

</section>


<!-- =====================================================
     ESTIMATES
===================================================== -->

<section
  id="estimates"
  class="page">


  <div class="card">

    <h2>📋 Saved Estimates</h2>


    <input
      id="estimateSearch"
      placeholder="🔎 Search estimate..."
      oninput="renderEstimates()">


    <div id="estimateList"></div>

  </div>

</section>


<!-- =====================================================
     BILL PREVIEW
===================================================== -->

<div
  id="previewOverlay"
  class="previewOverlay">


  <div class="previewBox">


    <button
      class="closePreview"
      onclick="closePreview()">

      ✕ Close

    </button>


    <div
      id="previewContent">
    </div>


  </div>

</div>


<script>

/* =====================================================
   STORAGE
===================================================== */

const PRODUCT_KEY =
  "saravana_products_v2";

const OLD_PRODUCT_KEY =
  "saravana_products_v1";

const ESTIMATE_KEY =
  "saravana_estimates_v4";


let products = [];

let estimates = [];

let billItems = [];

let selectedProductData = null;

let editingEstimate = null;

let keyboardIndex = -1;


/* =====================================================
   ELEMENTS
===================================================== */

const productSearch =
  document.getElementById("productSearch");

const productResults =
  document.getElementById("productResults");

const selectedProductBox =
  document.getElementById("selectedProduct");

const unit =
  document.getElementById("unit");

const qty =
  document.getElementById("qty");

const rate =
  document.getElementById("rate");

const items =
  document.getElementById("items");

const discount =
  document.getElementById("discount");


/* =====================================================
   LOAD DATA
===================================================== */

function loadData(){

  try{

    const saved =
      localStorage.getItem(PRODUCT_KEY);

    if(saved){

      products =
        JSON.parse(saved);

    }else{

      const old =
        localStorage.getItem(OLD_PRODUCT_KEY);

      if(old){

        const oldList =
          JSON.parse(old);

        products =
          oldList.map((p,i)=>{

            if(typeof p==="string"){

              return {
                id:
                  "p_"+Date.now()+"_"+i,

                name:p,

                unit:"Nos"
              };

            }

            return {

              id:
                p.id ||
                "p_"+Date.now()+"_"+i,

              name:
                p.name || "",

              unit:
                p.unit || "Nos"

            };

          });

        saveProducts();

      }

    }

  }catch(e){

    products=[];

  }


  try{

    estimates =
      JSON.parse(
        localStorage.getItem(
          ESTIMATE_KEY
        ) || "[]"
      );

  }catch(e){

    estimates=[];

  }

}


/* =====================================================
   SAVE DATA
===================================================== */

function saveProducts(){

  localStorage.setItem(
    PRODUCT_KEY,
    JSON.stringify(products)
  );

}


function saveEstimates(){

  localStorage.setItem(
    ESTIMATE_KEY,
    JSON.stringify(estimates)
  );

}


/* =====================================================
   PAGE
===================================================== */

function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(x =>
      x.classList.remove("active")
    );


  document
    .getElementById(page)
    .classList.add("active");


  document
    .querySelectorAll("nav button")
    .forEach(x =>
      x.classList.remove("active")
    );


  if(page==="home"){

    document
      .getElementById("homeNav")
      .classList.add("active");

  }


  if(page==="products"){

    document
      .getElementById("productsNav")
      .classList.add("active");

    renderProducts();

  }


  if(page==="estimates"){

    document
      .getElementById("estimatesNav")
      .classList.add("active");

    renderEstimates();

  }

}


/* =====================================================
   DATE
===================================================== */

function today(){

  const d =
    new Date();

  const y =
    d.getFullYear();

  const m =
    String(d.getMonth()+1)
      .padStart(2,"0");

  const day =
    String(d.getDate())
      .padStart(2,"0");

  return `${y}-${m}-${day}`;

}


/* =====================================================
   ESTIMATE NUMBER
===================================================== */

function nextEstimateNumber(){

  let max=0;

  estimates.forEach(e=>{

    const match =
      String(e.number||"")
        .match(/(\d+)$/);

    if(match){

      max =
        Math.max(
          max,
          parseInt(match[1])
        );

    }

  });


  return "EST-" +
    String(max+1)
      .padStart(3,"0");

}


/* =====================================================
   NEW ESTIMATE
===================================================== */

function newEstimate(){

  editingEstimate=null;

  billItems=[];

  selectedProductData=null;

  keyboardIndex=-1;


  document.getElementById(
    "estimateNo"
  ).value =
    nextEstimateNumber();


  document.getElementById(
    "estimateDate"
  ).value =
    today();


  productSearch.value="";

  unit.value="";

  qty.value="";

  rate.value="";

  discount.value="0";


  productResults
    .classList
    .add("hidden");


  renderItems();


  setTimeout(()=>{

    productSearch.focus();

  },100);

}


/* =====================================================
   PRODUCT SEARCH
===================================================== */

function searchProducts(){

  const text =
    productSearch.value
      .trim()
      .toLowerCase();


  let list =
    products;


  if(text){

    list =
      products.filter(p =>

        String(p.name||"")
          .toLowerCase()
          .includes(text)

      );

  }


  keyboardIndex=-1;


  if(!list.length){

    productResults.innerHTML =

      `<div class="empty">
        No product found
      </div>`;

  }else{

    productResults.innerHTML =

      list
        .slice(0,30)
        .map((p,index)=>`

          <div
            class="result"
            data-id="${escapeHTML(p.id)}"
            data-index="${index}">

            <strong>
              ${escapeHTML(p.name)}
            </strong>

            <span>
              ${escapeHTML(p.unit)}
            </span>

          </div>

        `)
        .join("");


    productResults
      .querySelectorAll(".result")
      .forEach(el=>{

        el.addEventListener(
          "click",
          function(){

            selectProduct(
              this.dataset.id
            );

          }
        );

      });

  }


  productResults
    .classList
    .remove("hidden");

}


/* =====================================================
   KEYBOARD PRODUCT NAVIGATION
===================================================== */

productSearch.addEventListener(
  "keydown",
  function(e){

    const resultElements =
      productResults
        .querySelectorAll(".result");


    if(
      e.key==="ArrowDown" &&
      !productResults.classList.contains("hidden")
    ){

      e.preventDefault();

      if(!resultElements.length)
        return;


      keyboardIndex++;

      if(
        keyboardIndex >=
        resultElements.length
      ){

        keyboardIndex=0;

      }


      resultElements
        .forEach(x =>
          x.classList
            .remove("keyboardActive")
        );


      resultElements[
        keyboardIndex
      ]
        .classList
        .add("keyboardActive");


      resultElements[
        keyboardIndex
      ]
        .scrollIntoView({
          block:"nearest"
        });

      return;

    }


    if(
      e.key==="ArrowUp" &&
      !productResults.classList.contains("hidden")
    ){

      e.preventDefault();

      if(!resultElements.length)
        return;


      keyboardIndex--;

      if(keyboardIndex<0){

        keyboardIndex =
          resultElements.length-1;

      }


      resultElements
        .forEach(x =>
          x.classList
            .remove("keyboardActive")
        );


      resultElements[
        keyboardIndex
      ]
        .classList
        .add("keyboardActive");


      resultElements[
        keyboardIndex
      ]
        .scrollIntoView({
          block:"nearest"
        });

      return;

    }


    if(e.key==="Enter"){

      e.preventDefault();


      if(
        !productResults
          .classList
          .contains("hidden") &&
        resultElements.length
      ){

        const index =
          keyboardIndex >= 0
          ? keyboardIndex
          : 0;


        selectProduct(
          resultElements[
            index
          ].dataset.id
        );

        return;

      }

    }

  }
);


/* =====================================================
   SELECT PRODUCT
===================================================== */

function selectProduct(id){

  const p =
    products.find(
      x => String(x.id)===String(id)
    );


  if(!p)
    return;


  selectedProductData=p;


  productSearch.value =
    p.name;


  unit.value =
    p.unit;


  productResults
    .classList
    .add("hidden");


  keyboardIndex=-1;


  /*
     IMPORTANT:
     PRODUCT SELECTED
     NOW GO DIRECTLY TO QTY
  */

  qty.focus();

}


/* =====================================================
   QTY ENTER
===================================================== */

qty.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      e.preventDefault();

      rate.focus();

    }

  }
);


/* =====================================================
   LIVE AMOUNT
===================================================== */

function liveCalculate(){

  const q =
    parseFloat(qty.value)||0;

  const r =
    parseFloat(rate.value)||0;


  document.getElementById(
    "liveAmount"
  ).textContent =
    "₹"+(q*r).toFixed(2);

}


qty.addEventListener(
  "input",
  liveCalculate
);

rate.addEventListener(
  "input",
  liveCalculate
);


/* =====================================================
   RATE ENTER
===================================================== */

rate.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      e.preventDefault();

      addItem();

    }

  }
);


/* =====================================================
   ADD ITEM
===================================================== */

function addItem(){

  if(!selectedProductData){

    alert(
      "Please select a product"
    );

    productSearch.focus();

    return;

  }


  const q =
    parseFloat(qty.value);


  const r =
    parseFloat(rate.value);


  if(!q || q<=0){

    alert(
      "Please enter quantity"
    );

    qty.focus();

    return;

  }


  if(isNaN(r) || r<0){

    alert(
      "Please enter rate"
    );

    rate.focus();

    return;

  }


  billItems.push({

    productId:
      selectedProductData.id,

    product:
      selectedProductData.name,

    unit:
      selectedProductData.unit,

    qty:q,

    rate:r,

    amount:q*r

  });


  renderItems();


  /*
     RESET FOR NEXT PRODUCT
  */

  selectedProductData=null;

  productSearch.value="";

  unit.value="";

  qty.value="";

  rate.value="";


  document.getElementById(
    "liveAmount"
  ).textContent="₹0.00";


  productResults
    .classList
    .add("hidden");


  /*
     AUTOMATICALLY GO TO
     NEXT PRODUCT
  */

  setTimeout(()=>{

    productSearch.focus();

  },50);

}


/* =====================================================
   RENDER ITEMS
===================================================== */

function renderItems(){

  if(!billItems.length){

    items.innerHTML =

      `<tr>
        <td
          colspan="6"
          class="noItems">

          No products added yet

        </td>
      </tr>`;

    calculateTotal();

    return;

  }


  items.innerHTML =

    billItems
      .map((item,i)=>`

        <tr>

          <td>
            ${i+1}
          </td>

          <td>
            ${escapeHTML(item.product)}
          </td>

          <td>
            ${Number(item.qty)}
          </td>

          <td>
            ${escapeHTML(item.unit)}
          </td>

          <td>
            ₹${Number(item.rate).toFixed(2)}
          </td>

          <td>

            ₹${Number(item.amount).toFixed(2)}

            <button
              class="removeBtn"
              onclick="removeItem(${i})">

              ✕

            </button>

          </td>

        </tr>

      `)
      .join("");


  calculateTotal();

}


/* =====================================================
   REMOVE ITEM
===================================================== */

function removeItem(i){

  billItems.splice(i,1);

  renderItems();

}


/* =====================================================
   TOTAL
===================================================== */

function calculateTotal(){

  const sub =
    billItems.reduce(
      (sum,x)=>
        sum+
        Number(x.amount||0),
      0
    );


  let dis =
    parseFloat(discount.value)||0;


  if(dis<0)
    dis=0;


  if(dis>sub)
    dis=sub;


  const total =
    sub-dis;


  document.getElementById(
    "subtotal"
  ).textContent =
    sub.toFixed(2);


  document.getElementById(
    "discountView"
  ).textContent =
    dis.toFixed(2);


  document.getElementById(
    "grandTotal"
  ).textContent =
    total.toFixed(2);

}


discount.addEventListener(
  "input",
  calculateTotal
);


/* =====================================================
   BUILD BILL OBJECT
===================================================== */

function getCurrentBill(){

  const sub =
    billItems.reduce(
      (sum,x)=>
        sum+Number(x.amount||0),
      0
    );


  let dis =
    parseFloat(discount.value)||0;


  if(dis<0)
    dis=0;


  if(dis>sub)
    dis=sub;


  return {

    id:
      editingEstimate ||
      "e_"+Date.now(),

    number:
      document.getElementById(
        "estimateNo"
      ).value,

    date:
      document.getElementById(
        "estimateDate"
      ).value,

    items:
      billItems,

    subtotal:
      sub,

    discount:
      dis,

    total:
      sub-dis

  };

}


/* =====================================================
   SAVE ESTIMATE
===================================================== */

function saveEstimate(){

  if(!billItems.length){

    alert(
      "Please add at least one product"
    );

    productSearch.focus();

    return;

  }


  const bill =
    getCurrentBill();


  if(editingEstimate){

    const index =
      estimates.findIndex(
        x=>x.id===editingEstimate
      );


    if(index!==-1){

      estimates[index]=bill;

    }

  }else{

    estimates.push(bill);

  }


  saveEstimates();


  editingEstimate =
    bill.id;


  alert(
    editingEstimate
    ? "Estimate saved successfully"
    : "Estimate saved successfully"
  );


  renderEstimates();

}

function viewCurrentEstimate(){

}

/* =====================================================
   SAVE PRODUCT
===================================================== */

function saveProduct(){

  const name =
    document
      .getElementById(
        "newProductName"
      )
      .value
      .trim();


  const u =
    document
      .getElementById(
        "newProductUnit"
      )
      .value;


  if(!name){

    alert(
      "Please enter product name"
    );

    return;

  }


  if(!u){

    alert(
      "Please select unit"
    );

    return;

  }


  const exists =
    products.some(
      p =>
        String(p.name)
          .toLowerCase() ===
        name.toLowerCase()
    );


  if(exists){

    alert(
      "Product already exists"
    );

    return;

  }


  products.push({

    id:
      "p_"+Date.now(),

    name:name,

    unit:u

  });


  saveProducts();


  document
    .getElementById(
      "newProductName"
    )
    .value="";


  document
    .getElementById(
      "newProductUnit"
    )
    .value="";


  renderProducts();


  alert(
    "Product saved successfully"
  );

}


/* =====================================================
   PRODUCTS LIST
===================================================== */

function renderProducts(){

  const text =
    document
      .getElementById(
        "productListSearch"
      )
      .value
      .trim()
      .toLowerCase();


  const list =
    products.filter(p =>
      String(p.name||"")
        .toLowerCase()
        .includes(text)
    );


  const box =
    document.getElementById(
      "productList"
    );


  if(!list.length){

    box.innerHTML =
      `<div class="empty">
        No products found
      </div>`;

    return;

  }


  box.innerHTML =
    list
      .map(p=>`

        <div class="listItem">

          <div>

            <strong>
              ${escapeHTML(p.name)}
            </strong>

            <span class="badge">
              ${escapeHTML(p.unit)}
            </span>

          </div>


          <div class="actions">

            <button
              class="secondary"
              onclick="editProduct('${escapeHTML(p.id)}')">

              Edit

            </button>


            <button
              class="danger"
              onclick="deleteProduct('${escapeHTML(p.id)}')">

              Delete

            </button>

          </div>

        </div>

      `)
      .join("");

}


/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(id){

  const p =
    products.find(
      x=>String(x.id)===String(id)
    );


  if(!p)
    return;


  const name =
    prompt(
      "Product Name",
      p.name
    );


  if(name===null)
    return;


  const unitValue =
    prompt(
      "Unit",
      p.unit
    );


  if(unitValue===null)
    return;


  if(
    !name.trim() ||
    !unitValue.trim()
  ){

    alert(
      "Both fields are required"
    );

    return;

  }


  p.name =
    name.trim();

  p.unit =
    unitValue.trim();


  saveProducts();

  renderProducts();

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

function deleteProduct(id){

  const p =
    products.find(
      x=>String(x.id)===String(id)
    );


  if(!p)
    return;


  if(
    !confirm(
      `Delete "${p.name}"?`
    )
  )
    return;


  products =
    products.filter(
      x=>String(x.id)!==String(id)
    );


  saveProducts();

  renderProducts();

}


/* =====================================================
   ESTIMATE LIST
===================================================== */

function renderEstimates(){

  const text =
    document
      .getElementById(
        "estimateSearch"
      )
      .value
      .trim()
      .toLowerCase();


  const list =
    estimates
      .slice()
      .reverse()
      .filter(e =>
        String(e.number||"")
          .toLowerCase()
          .includes(text)
      );


  const box =
    document.getElementById(
      "estimateList"
    );


  if(!list.length){

    box.innerHTML =
      `<div class="empty">
        No saved estimates
      </div>`;

    return;

  }


  box.innerHTML =
    list
      .map(e=>`

        <div class="listItem">

          <div>

            <strong>
              ${escapeHTML(e.number)}
            </strong>

            <div
              style="font-size:11px;color:#777;margin-top:4px">

              ${escapeHTML(e.date||"")}

              ·

              ${(e.items||[]).length}
              product(s)

            </div>

          </div>


          <div>

            <strong style="margin-right:12px">

              ₹${Number(e.total||0).toFixed(2)}

            </strong>


            <div

              </button>

}


/* =====================================================
   VIEW SAVED ESTIMATE
===================================================== */

function viewSavedEstimate(id){

  const e =
    estimates.find(
      x=>String(x.id)===String(id)
    );


  if(!e)
    return;


  showPreview(e);

}


/* =====================================================
   EDIT ESTIMATE
===================================================== */

function editEstimate(id){

  const e =
    estimates.find(
      x=>String(x.id)===String(id)
    );


  if(!e)
    return;


  editingEstimate=e.id;


  document.getElementById(
    "estimateNo"
  ).value =
    e.number||"";


  document.getElementById(
    "estimateDate"
  ).value =
    e.date||today();


  billItems =
    (e.items||[])
      .map(x=>({

        productId:
          x.productId||"",

        product:
          x.product||"",

        unit:
          x.unit||"Nos",

        qty:
          Number(x.qty||0),

        rate:
          Number(
            x.rate ??
            x.price ??
            0
          ),

        amount:
          Number(
            x.amount ??
            (
              Number(x.qty||0) *
              Number(
                x.rate ??
                x.price ??
                0
              )
            )
          )

      }));


  discount.value =
    e.discount||0;


  selectedProductData=null;

  productSearch.value="";

  unit.value="";

  qty.value="";

  rate.value="";


  renderItems();

  showPage("home");


  setTimeout(()=>{

    productSearch.focus();

  },100);

}


/* =====================================================
   DELETE ESTIMATE
===================================================== */

function deleteEstimate(id){

  const e =
    estimates.find(
      x=>String(x.id)===String(id)
    );


  if(!e)
    return;


  if(
    !confirm(
      `Delete ${e.number}?`
    )
  )
    return;


  estimates =
    estimates.filter(
      x=>String(x.id)!==String(id)
    );


  saveEstimates();

  renderEstimates();

}

   PRODUCT SEARCH EVENTS
===================================================== */

productSearch.addEventListener(

  searchProducts
);


productSearch.addEventListener(
  "focus",

    /*
       Open list when user
       clicks/focuses search
    */

    searchProducts();

  }
);


/* =====================================================
   CLICK OUTSIDE SEARCH
===================================================== */

document.addEventListener(
  "click",
  function(e){

    if(
      !e.target.closest(".searchWrap")
    ){

      productResults
        .classList
        .add("hidden");

    }

  }
);


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
