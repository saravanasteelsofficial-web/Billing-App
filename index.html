<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saravana Steel Company - Estimate</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#f4f6f9;color:#222}
body{display:flex;flex-direction:column}
header{background:#0b1730;color:#fff;padding:10px 18px;flex:0 0 auto}
header h1{margin:0;font-size:19px}
header p{margin:3px 0 0;font-size:11px;line-height:1.25}
nav{display:flex;background:#fff;border-bottom:1px solid #ccc;flex:0 0 auto}
nav button{border:0;background:#fff;padding:9px 22px;font-size:13px;font-weight:bold}
nav button.active{color:#0b1730;border-bottom:3px solid #0b1730}
.page{display:none;width:100%;height:calc(100vh - 83px);overflow:hidden;padding:8px}
.page.active{display:block}
.card{background:#fff;border:1px solid #ddd;padding:9px;margin-bottom:7px}
h2{margin:0 0 7px;font-size:16px}
h3{margin:0 0 6px;font-size:14px}
label{display:block;font-size:11px;font-weight:bold;margin:4px 0 3px}
input,select{width:100%;height:32px;padding:6px 8px;border:1px solid #bbb;border-radius:4px;font-size:13px;background:#fff}
button{font-family:inherit;cursor:pointer}
.primary{border:0;background:#0b1730;color:#fff;padding:8px 15px;border-radius:4px;font-size:13px;font-weight:bold}
.secondary{border:0;background:#eee;color:#222;padding:7px 12px;border-radius:4px;font-weight:bold}
.danger{border:0;background:#dc3545;color:#fff;padding:6px 10px;border-radius:4px}
.topRow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.entryRow{display:grid;grid-template-columns:minmax(300px,1fr) 120px 130px 150px;gap:8px;align-items:end}
.searchWrap{position:relative}
.results{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #aaa;max-height:220px;overflow-y:auto;z-index:1000;box-shadow:0 5px 14px rgba(0,0,0,.18)}
.result{height:31px;padding:7px 9px;border-bottom:1px solid #eee;font-size:12px;display:flex;justify-content:space-between;gap:10px}
.result.active{background:#dfe8ff}
.result span{color:#666}
.hidden{display:none!important}
.billRow>div:last-child{text-align:right}
.viewModal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px}
.billPreview{background:#fff;width:min(900px,96vw);max-height:92vh;overflow:auto;padding:24px;border-radius:6px;box-shadow:0 10px 35px rgba(0,0,0,.3)}
.previewHead{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #222;padding-bottom:12px;margin-bottom:14px}
.previewCompany{font-size:20px;font-weight:bold}.previewTitle{font-size:18px;font-weight:bold;text-align:right}
.previewTable{width:100%;border-collapse:collapse;font-size:13px}.previewTable th,.previewTable td{border:1px solid #bbb;padding:8px;text-align:left}.previewTable th:nth-child(n+3),.previewTable td:nth-child(n+3){text-align:right}
.previewTotals{margin-left:auto;width:300px;margin-top:15px}.previewTotals div{display:flex;justify-content:space-between;padding:5px 0}.previewGrand{border-top:2px solid #222;font-size:18px;font-weight:bold;margin-top:5px;padding-top:8px!important}
.previewClose{display:flex;justify-content:flex-end;margin-top:18px;gap:8px}
@media(max-width:700px){.previewHead{flex-direction:column}.previewTitle{text-align:left}.previewTotals{width:100%}}
.billArea{height:calc(100vh - 275px);min-height:180px;border:1px solid #bbb;background:#fff;overflow:auto}
.billHead,.billRow{display:grid;grid-template-columns:45px minmax(260px,1fr) 100px 100px 120px 70px;align-items:center}
.billHead{background:#e6f0e8;font-weight:bold;font-size:11px;border-bottom:1px solid #bbb;position:sticky;top:0;z-index:2}
.billHead>div,.billRow>div{padding:7px;border-right:1px solid #ddd}
.billRow{font-size:12px;border-bottom:1px solid #eee}
.billEmpty{text-align:center;padding:35px;color:#777}
.bottomBar{height:48px;display:flex;align-items:center;justify-content:flex-end;gap:10px}
.hint{margin-right:auto;color:#777;font-size:11px}
.totalBox{font-size:15px;font-weight:bold}
.summaryLine{display:flex;gap:25px;align-items:center;justify-content:flex-end;font-size:12px}
.list{height:calc(100vh - 145px);overflow:auto}
.listItem{background:#fff;border:1px solid #ddd;padding:9px;margin-bottom:6px}
.listTop{display:flex;justify-content:space-between;gap:8px}
.listName{font-weight:bold;font-size:13px}
.itemInfo{color:#666;font-size:11px;margin-top:3px}
.actions{display:flex;gap:7px;margin-top:7px}
.actions button{flex:0 0 auto}
.productGrid{display:grid;grid-template-columns:1fr 150px 130px;gap:8px;align-items:end}
@media(max-width:800px){
  .entryRow{grid-template-columns:1fr 100px}
  .entryRow .rateBox,.entryRow .addBox{grid-column:span 1}
  .billArea{height:calc(100vh - 315px)}
  .billHead,.billRow{grid-template-columns:35px minmax(180px,1fr) 70px 80px 100px 55px}
}
</style>
</head>
<body>

<header>
  <h1>Saravana Steel Company</h1>
  <p>Estimate &amp; Billing</p>
</header>

<nav>
  <button id="homeNav" class="active" onclick="showPage('home')">🧾 Billing</button>
  <button id="productsNav" onclick="showPage('products')">📦 Products</button>
  <button id="estimatesNav" onclick="showPage('estimates')">📋 Estimates</button>
</nav>

<section id="home" class="page active">
  <div class="card">
    <div class="topRow">
      <div>
        <label>ESTIMATE &nbsp; Estimate No.</label>
        <input id="estimateNo" readonly>
      </div>
      <div>
        <label>Date</label>
        <input id="estimateDate" type="date">
      </div>
    </div>
  </div>

  <div class="card">
    <h3>➕ Add Product</h3>
    <div class="entryRow">
      <div class="searchWrap">
        <label>Product</label>
        <input id="productSearch" placeholder="Search / select product..." autocomplete="off">
        <div id="productResults" class="results hidden"></div>
      </div>
      <div>
        <label>Unit</label>
        <input id="unit" readonly placeholder="-">
      </div>
      <div>
        <label>Qty</label>
        <input id="qty" type="number" min="0" step="0.01" placeholder="Qty">
      </div>
      <div class="rateBox">
        <label>Rate</label>
        <input id="rate" type="number" min="0" step="0.01" placeholder="Rate → Enter">
      </div>
    </div>
    <div class="summaryLine" style="margin-top:5px">
      <span>Amount: ₹<strong id="liveAmount">0.00</strong></span>
    </div>
  </div>

  <div class="billArea">
    <div class="billHead">
      <div>S.No</div><div>Product</div><div>Qty</div><div>Unit</div><div>Rate</div><div>Amount</div>
    </div>
    <div id="items"><div class="billEmpty">No products added yet</div></div>
  </div>

  <div class="bottomBar">
    <div class="hint">↓ / ↑ Select product &nbsp; • &nbsp; ENTER select/add</div>
    <div>Subtotal: ₹<strong id="subtotal">0.00</strong></div>
    <label style="margin:0">Discount <input id="discount" type="number" min="0" step="0.01" value="0" style="width:100px;height:28px;display:inline-block"></label>
    <div class="totalBox">Total: ₹<span id="grandTotal">0.00</span></div>
    <button class="primary" onclick="generateBill()">💾 Save Estimate</button>
    <button class="secondary" onclick="newEstimate()">+ New</button>
  </div>
</section>

<section id="products" class="page">
  <div class="card">
    <h2>📦 Products</h2>
    <div class="productGrid">
      <div><label>Product Name</label><input id="newProductName" placeholder="Example: TMT 10mm"></div>
      <div><label>Unit</label>
        <select id="newProductUnit">
          <option value="">Select Unit</option>
          <option>Nos</option><option>Kg</option><option>Ton</option><option>Bag</option>
          <option>Litre</option><option>Piece</option><option>Box</option><option>Meter</option>
        </select>
      </div>
      <button class="primary" onclick="saveProduct()">💾 Save Product</button>
    </div>
  </div>
  <div class="card">
    <input id="productListSearch" placeholder="🔎 Search products..." oninput="renderProducts()">
  </div>
  <div id="productList" class="list"></div>
</section>

<section id="estimates" class="page">
  <div class="card">
    <h2>📋 Saved Estimates</h2>
    <input id="estimateSearch" placeholder="🔎 Search estimate..." oninput="renderEstimates()">
  </div>
  <div id="estimateList" class="list"></div>
</section>

<div id="viewBillModal" class="viewModal hidden">
  <div class="billPreview">
    <div id="billPreviewContent"></div>
    <div class="previewClose">
      <button class="secondary" onclick="closeBillView()">Close</button>
    </div>
  </div>
</div>

<script>
const PRODUCT_KEY="saravana_products_v2";
const OLD_PRODUCT_KEY="saravana_products_v1";
const ESTIMATE_KEY="saravana_estimates_v4";

let products=[];
let estimates=[];
let billItems=[];
let selectedProductData=null;
let selectedResultIndex=-1;
let editingEstimate=null;

const $=id=>document.getElementById(id);

function loadData(){
  try{
    const saved=localStorage.getItem(PRODUCT_KEY);
    if(saved) products=JSON.parse(saved);
    else{
      const old=localStorage.getItem(OLD_PRODUCT_KEY);
      if(old){
        products=JSON.parse(old).map((p,i)=>typeof p==="string"
          ? {id:"p_"+Date.now()+"_"+i,name:p,unit:"Nos"}
          : {id:p.id||"p_"+Date.now()+"_"+i,name:p.name||"",unit:p.unit||"Nos"});
        saveProducts();
      }
    }
  }catch(e){products=[]}
  try{estimates=JSON.parse(localStorage.getItem(ESTIMATE_KEY)||"[]")}catch(e){estimates=[]}
}
function saveProducts(){localStorage.setItem(PRODUCT_KEY,JSON.stringify(products))}
function saveEstimates(){localStorage.setItem(ESTIMATE_KEY,JSON.stringify(estimates))}

function showPage(page){
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  $(page).classList.add("active");
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  if(page==="home")$("homeNav").classList.add("active");
  if(page==="products"){ $("productsNav").classList.add("active"); renderProducts(); }
  if(page==="estimates"){ $("estimatesNav").classList.add("active"); renderEstimates(); }
}

function today(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function nextEstimateNumber(){
  let max=0;
  estimates.forEach(e=>{
    const m=String(e.number||"").match(/(\d+)$/);
    if(m)max=Math.max(max,parseInt(m[1]));
  });
  return "EST-"+String(max+1).padStart(3,"0");
}

function resetEntry(){
  selectedProductData=null;
  selectedResultIndex=-1;
  $("productSearch").value="";
  $("unit").value="";
  $("qty").value="";
  $("rate").value="";
  $("liveAmount").textContent="0.00";
  $("productResults").classList.add("hidden");
}

function newEstimate(){
  editingEstimate=null;
  billItems=[];
  $("estimateNo").value=nextEstimateNumber();
  $("estimateDate").value=today();
  $("discount").value="0";
  resetEntry();
  renderItems();
  setTimeout(()=>$("productSearch").focus(),50);
}

function getFilteredProducts(){
  const text=$("productSearch").value.trim().toLowerCase();
  return products.filter(p=>!text || String(p.name||"").toLowerCase().includes(text)).slice(0,30);
}

function searchProducts(){
  const input=$("productSearch");
  const text=input.value.trim();
  if(!text){
    $("productResults").classList.add("hidden");
    selectedResultIndex=-1;
    return;
  }
  const list=getFilteredProducts();
  selectedResultIndex=-1;
  if(!list.length){
    $("productResults").innerHTML='<div class="result"><span>No product found</span></div>';
  }else{
    $("productResults").innerHTML=list.map((p,i)=>
      `<div class="result" data-index="${i}" onclick="selectProduct('${String(p.id).replace(/'/g,"\\'")}')">
        <strong>${escapeHTML(p.name)}</strong><span>${escapeHTML(p.unit)}</span>
      </div>`).join("");
  }
  $("productResults").classList.remove("hidden");
}

function highlightResult(){
  const rows=[...$("productResults").querySelectorAll(".result")];
  rows.forEach((r,i)=>r.classList.toggle("active",i===selectedResultIndex));
  if(rows[selectedResultIndex]) rows[selectedResultIndex].scrollIntoView({block:"nearest"});
}

function selectProduct(id){
  const p=products.find(x=>String(x.id)===String(id));
  if(!p)return;
  selectedProductData=p;
  $("productSearch").value=p.name;
  $("unit").value=p.unit;
  $("productResults").classList.add("hidden");
  selectedResultIndex=-1;
  $("qty").focus();
}

$("productSearch").addEventListener("input",searchProducts);
$("productSearch").addEventListener("keydown",e=>{
  const box=$("productResults");
  const open=!box.classList.contains("hidden");
  const list=getFilteredProducts();
  if(e.key==="ArrowDown"){
    if(!open){searchProducts();return}
    if(list.length){e.preventDefault();selectedResultIndex=Math.min(selectedResultIndex+1,list.length-1);highlightResult()}
  }else if(e.key==="ArrowUp"){
    if(open&&list.length){e.preventDefault();selectedResultIndex=Math.max(selectedResultIndex-1,0);highlightResult()}
  }else if(e.key==="Enter"){
    if(open&&list.length){
      e.preventDefault();
      const p=list[Math.max(0,selectedResultIndex)];
      selectProduct(p.id);
    }
  }else if(e.key==="Escape"){
    box.classList.add("hidden");selectedResultIndex=-1;
  }
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".searchWrap"))$("productResults").classList.add("hidden");
});

function liveCalculate(){
  const q=parseFloat($("qty").value)||0, r=parseFloat($("rate").value)||0;
  $("liveAmount").textContent=(q*r).toFixed(2);
}
$("qty").addEventListener("input",liveCalculate);
$("rate").addEventListener("input",liveCalculate);
$("qty").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    if(!selectedProductData){alert("Please select a product");$("productSearch").focus();return}
    const q=parseFloat($("qty").value);
    if(!q||q<=0){alert("Please enter quantity");return}
    $("rate").focus();
  }
});
$("rate").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();addItem()}
});

function addItem(){
  if(!selectedProductData){$("productSearch").focus();searchProducts();return}
  const q=parseFloat($("qty").value),r=parseFloat($("rate").value);
  if(!q||q<=0){alert("Please enter quantity");$("qty").focus();return}
  if(isNaN(r)||r<0){alert("Please enter rate");$("rate").focus();return}
  billItems.push({productId:selectedProductData.id,product:selectedProductData.name,unit:selectedProductData.unit,qty:q,rate:r,amount:q*r});
  renderItems();
  resetEntry();
  setTimeout(()=>$("productSearch").focus(),50);
}

function renderItems(){
  if(!billItems.length){
    $("items").innerHTML='<div class="billEmpty">No products added yet</div>';
    calculateTotal();return;
  }
  $("items").innerHTML=billItems.map((x,i)=>`
    <div class="billRow">
      <div>${i+1}</div>
      <div><strong>${escapeHTML(x.product)}</strong></div>
      <div>${x.qty}</div>
      <div>${escapeHTML(x.unit)}</div>
      <div>₹${Number(x.rate).toFixed(2)}</div>
      <div>₹${Number(x.amount).toFixed(2)}<br><button class="danger" onclick="removeItem(${i})">×</button></div>
    </div>`).join("");
  calculateTotal();
}
function removeItem(i){billItems.splice(i,1);renderItems()}
function calculateTotal(){
  const sub=billItems.reduce((s,x)=>s+Number(x.amount||0),0);
  let dis=parseFloat($("discount").value)||0;
  if(dis<0)dis=0;if(dis>sub)dis=sub;
  $("subtotal").textContent=sub.toFixed(2);
  $("grandTotal").textContent=(sub-dis).toFixed(2);
}
$("discount").addEventListener("input",calculateTotal);

function generateBill(){
  if(!billItems.length){alert("Please add at least one product");$("productSearch").focus();return}
  const sub=billItems.reduce((s,x)=>s+Number(x.amount||0),0);
  let dis=parseFloat($("discount").value)||0;if(dis<0)dis=0;if(dis>sub)dis=sub;
  const bill={id:editingEstimate||"e_"+Date.now(),number:$("estimateNo").value,date:$("estimateDate").value,items:billItems,subtotal:sub,discount:dis,total:sub-dis};
  if(editingEstimate){
    const i=estimates.findIndex(x=>x.id===editingEstimate);
    if(i!==-1)estimates[i]=bill;
  }else estimates.push(bill);
  saveEstimates();
  alert(editingEstimate?"Estimate updated successfully":"Estimate saved successfully");
  showPage("estimates");
  newEstimate();
}

function saveProduct(){
  const name=$("newProductName").value.trim(),u=$("newProductUnit").value;
  if(!name){alert("Please enter product name");return}
  if(!u){alert("Please select unit");return}
  if(products.some(p=>String(p.name).toLowerCase()===name.toLowerCase())){alert("Product already exists");return}
  products.push({id:"p_"+Date.now(),name,unit:u});
  saveProducts();$("newProductName").value="";$("newProductUnit").value="";renderProducts();alert("Product saved successfully");
}
function renderProducts(){
  const text=$("productListSearch").value.trim().toLowerCase();
  const list=products.filter(p=>String(p.name).toLowerCase().includes(text));
  $("productList").innerHTML=list.length?list.map(p=>`
    <div class="listItem">
      <div class="listTop"><div class="listName">${escapeHTML(p.name)}</div><div>${escapeHTML(p.unit)}</div></div>
      <div class="actions">
        <button class="secondary" onclick="editProduct('${String(p.id).replace(/'/g,"\\'")}')">Edit</button>
        <button class="danger" onclick="deleteProduct('${String(p.id).replace(/'/g,"\\'")}')">Delete</button>
      </div>
    </div>`).join(""):'<div class="listItem itemInfo">No products found</div>';
}
function editProduct(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  const n=prompt("Product Name",p.name);if(n===null)return;
  const u=prompt("Unit",p.unit);if(u===null)return;
  if(!n.trim()||!u.trim()){alert("Both fields are required");return}
  p.name=n.trim();p.unit=u.trim();saveProducts();renderProducts();
}
function deleteProduct(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  if(confirm(`Delete "${p.name}"?`)){products=products.filter(x=>x.id!==id);saveProducts();renderProducts()}
}

function renderEstimates(){
  const text=$("estimateSearch").value.trim().toLowerCase();
  const list=estimates.slice().reverse().filter(e=>String(e.number||"").toLowerCase().includes(text));
  $("estimateList").innerHTML=list.length?list.map(e=>`
    <div class="listItem">
      <div class="listTop"><div><div class="listName">${escapeHTML(e.number)}</div><div class="itemInfo">${escapeHTML(e.date||"")}</div></div><strong>₹${Number(e.total||0).toFixed(2)}</strong></div>
      <div class="itemInfo">${(e.items||[]).length} product(s)</div>
      <div class="actions"><button class="secondary" onclick="editEstimate('${String(e.id).replace(/'/g,"\\'")}')">Edit</button><button class="danger" onclick="deleteEstimate('${String(e.id).replace(/'/g,"\\'")}')">Delete</button></div>
    </div>`).join(""):'<div class="listItem itemInfo">No saved estimates</div>';
}
function editEstimate(id){
  const e=estimates.find(x=>x.id===id);if(!e)return;
  editingEstimate=e.id;
  $("estimateNo").value=e.number||"";
  $("estimateDate").value=e.date||today();
  billItems=(e.items||[]).map(x=>({productId:x.productId||"",product:x.product||"",unit:x.unit||"Nos",qty:Number(x.qty||0),rate:Number(x.rate??x.price??0),amount:Number(x.amount??(Number(x.qty||0)*Number(x.rate??x.price??0)))}));
  $("discount").value=e.discount||0;
  resetEntry();renderItems();showPage("home");
}
function viewBill(id){
  const e=estimates.find(x=>String(x.id)===String(id));
  if(!e)return;
  const rows=(e.items||[]).map((x,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${escapeHTML(x.product||"")}</td>
      <td>${Number(x.qty||0)}</td>
      <td>${escapeHTML(x.unit||"")}</td>
      <td>₹${Number(x.rate||0).toFixed(2)}</td>
      <td>₹${Number(x.amount||0).toFixed(2)}</td>
    </tr>`).join("");
  const discount=Number(e.discount||0);
  const subtotal=Number(e.subtotal||0);
  const total=Number(e.total||0);
  $("billPreviewContent").innerHTML=`
    <div class="previewHead">
      <div><div class="previewCompany">Saravana Steel Company</div><div>No.7, New Goller Street, (Opp to Bus Stand) Alangayam - 635701</div><div>📞 9943706320 / 7010795644</div></div>
      <div class="previewTitle">ESTIMATE<br><span style="font-size:13px;font-weight:normal">No: ${escapeHTML(e.number||"")}<br>Date: ${escapeHTML(e.date||"")}</span></div>
    </div>
    <table class="previewTable"><thead><tr><th>S.No</th><th>Product</th><th>Qty</th><th>Unit</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="previewTotals">
      <div><span>Subtotal</span><strong>₹${subtotal.toFixed(2)}</strong></div>
      <div><span>Discount</span><strong>₹${discount.toFixed(2)}</strong></div>
      <div class="previewGrand"><span>Grand Total</span><strong>₹${total.toFixed(2)}</strong></div>
    </div>`;
  $("viewBillModal").classList.remove("hidden");
}
function closeBillView(){$("viewBillModal").classList.add("hidden")}
$("viewBillModal").addEventListener("click",e=>{if(e.target.id==="viewBillModal")closeBillView()});

function deleteEstimate(id){
  const e=estimates.find(x=>x.id===id);if(!e)return;
  if(confirm(`Delete ${e.number}?`)){estimates=estimates.filter(x=>x.id!==id);saveEstimates();renderEstimates()}
}
function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}

loadData();
$("estimateNo").value=nextEstimateNumber();
$("estimateDate").value=today();
renderItems();
renderProducts();
renderEstimates();
</script>
</body>
</html>
