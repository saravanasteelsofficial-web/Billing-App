<script>

/* =====================================================
   STORAGE
===================================================== */

const PRODUCT_KEY = "saravana_products_v2";
const OLD_PRODUCT_KEY = "saravana_products_v1";
const ESTIMATE_KEY = "saravana_estimates_v5";


let products = [];
let estimates = [];
let billItems = [];

let selectedProductData = null;
let editingEstimate = null;

let highlightedProductIndex = -1;


/* =====================================================
   ELEMENTS
===================================================== */

const homePage =
  document.getElementById("home");

const productsPage =
  document.getElementById("products");

const estimatesPage =
  document.getElementById("estimates");

const homeNav =
  document.getElementById("homeNav");

const productsNav =
  document.getElementById("productsNav");

const estimatesNav =
  document.getElementById("estimatesNav");

const productSearch =
  document.getElementById("productSearch");

const productResults =
  document.getElementById("productResults");

const unitInput =
  document.getElementById("unit");

const qtyInput =
  document.getElementById("qty");

const rateInput =
  document.getElementById("rate");

const liveAmount =
  document.getElementById("liveAmount");

const itemsBox =
  document.getElementById("items");

const subtotalBox =
  document.getElementById("subtotal");

const discountInput =
  document.getElementById("discount");

const grandTotalBox =
  document.getElementById("grandTotal");

const estimateNoInput =
  document.getElementById("estimateNo");

const estimateDateInput =
  document.getElementById("estimateDate");

const productListSearch =
  document.getElementById("productListSearch");

const productList =
  document.getElementById("productList");

const estimateSearch =
  document.getElementById("estimateSearch");

const estimateList =
  document.getElementById("estimateList");


/* =====================================================
   LOAD DATA
===================================================== */

function loadData(){

  try{

    const saved =
      localStorage.getItem(PRODUCT_KEY);

    if(saved){

      products =
        JSON.parse(saved);

    }else{

      const old =
        localStorage.getItem(OLD_PRODUCT_KEY);

      if(old){

        const oldList =
          JSON.parse(old);

        products =
          oldList.map((p,i)=>{

            if(typeof p === "string"){

              return {
                id:
                  "p_"+Date.now()+"_"+i,

                name:
                  p,

                unit:
                  "Nos"
              };

            }

            return {

              id:
                p.id ||
                "p_"+Date.now()+"_"+i,

              name:
                p.name || "",

              unit:
                p.unit || "Nos"

            };

          });

        saveProducts();

      }

    }

  }catch(error){

    products=[];

  }


  try{

    const savedEstimates =
      localStorage.getItem(ESTIMATE_KEY);

    if(savedEstimates){

      estimates =
        JSON.parse(savedEstimates);

    }else{

      const oldEstimates =
        localStorage.getItem(
          "saravana_estimates_v4"
        );

      estimates =
        oldEstimates
        ? JSON.parse(oldEstimates)
        : [];

    }

  }catch(error){

    estimates=[];

  }

}


/* =====================================================
   SAVE
===================================================== */

function saveProducts(){

  localStorage.setItem(
    PRODUCT_KEY,
    JSON.stringify(products)
  );

}


function saveEstimates(){

  localStorage.setItem(
    ESTIMATE_KEY,
    JSON.stringify(estimates)
  );

}


/* =====================================================
   PAGE NAVIGATION
===================================================== */

function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(section=>{

      section.classList.remove("active");

    });


  document
    .querySelectorAll("nav button")
    .forEach(button=>{

      button.classList.remove("active");

    });


  if(page === "home"){

    homePage.classList.add("active");

    homeNav.classList.add("active");

    /*
       Do NOT automatically open
       product list here.
    */

    setTimeout(()=>{

      productSearch.focus();

    },100);

  }


  if(page === "products"){

    productsPage.classList.add("active");

    productsNav.classList.add("active");

    productResults
      .classList
      .add("hidden");

    renderProducts();

  }


  if(page === "estimates"){

    estimatesPage.classList.add("active");

    estimatesNav.classList.add("active");

    productResults
      .classList
      .add("hidden");

    renderEstimates();

  }

}


/* =====================================================
   DATE
===================================================== */

function today(){

  const d =
    new Date();

  const y =
    d.getFullYear();

  const m =
    String(d.getMonth()+1)
    .padStart(2,"0");

  const day =
    String(d.getDate())
    .padStart(2,"0");

  return `${y}-${m}-${day}`;

}


/* =====================================================
   ESTIMATE NUMBER
===================================================== */

function nextEstimateNumber(){

  let max = 0;


  estimates.forEach(e=>{

    const match =
      String(e.number || "")
      .match(/(\d+)$/);


    if(match){

      max =
        Math.max(
          max,
          parseInt(match[1],10)
        );

    }

  });


  return "EST-" +
    String(max+1)
    .padStart(3,"0");

}


/* =====================================================
   NEW ESTIMATE
===================================================== */

function newEstimate(){

  editingEstimate = null;

  billItems = [];

  selectedProductData = null;

  highlightedProductIndex = -1;


  estimateNoInput.value =
    nextEstimateNumber();

  estimateDateInput.value =
    today();


  productSearch.value = "";

  unitInput.value = "";

  qtyInput.value = "";

  rateInput.value = "";

  discountInput.value = "0";

  liveAmount.textContent = "0.00";


  productResults
    .classList
    .add("hidden");


  renderItems();


  setTimeout(()=>{

    productSearch.focus();

  },100);

}


/* =====================================================
   PRODUCT SEARCH LIST
===================================================== */

function getFilteredProducts(){

  const text =
    productSearch.value
    .trim()
    .toLowerCase();


  if(!text){

    return [];

  }


  return products.filter(p=>{

    return String(p.name || "")
      .toLowerCase()
      .includes(text);

  });

}


/* =====================================================
   SEARCH PRODUCTS
===================================================== */

function searchProducts(){

  const text =
    productSearch.value
    .trim();


  /*
     VERY IMPORTANT:

     Empty search = popup CLOSED
  */

  if(!text){

    productResults
      .classList
      .add("hidden");

    highlightedProductIndex = -1;

    return;

  }


  const list =
    getFilteredProducts();


  highlightedProductIndex = -1;


  if(!list.length){

    productResults.innerHTML =
      `<div class="empty">
        No product found
      </div>`;

  }else{

    productResults.innerHTML =
      list
      .slice(0,40)
      .map((p,index)=>`

        <div
          class="result"
          data-index="${index}">

          <strong>
            ${escapeHTML(p.name)}
          </strong>

          <span class="resultUnit">
            ${escapeHTML(p.unit)}
          </span>

        </div>

      `)
      .join("");

  }


  productResults
    .classList
    .remove("hidden");

}


/* =====================================================
   HIGHLIGHT PRODUCT
===================================================== */

function highlightProduct(index){

  const rows =
    productResults
    .querySelectorAll(".result");


  if(!rows.length)
    return;


  if(index < 0)
    index = 0;


  if(index >= rows.length)
    index = rows.length - 1;


  rows.forEach(row=>{

    row.classList.remove("active");

  });


  const row =
    rows[index];


  if(row){

    row.classList.add("active");

    row.scrollIntoView({
      block:"nearest"
    });

  }


  highlightedProductIndex =
    index;

}


/* =====================================================
   SELECT PRODUCT
===================================================== */

function selectProductByIndex(index){

  const list =
    getFilteredProducts();


  if(!list.length)
    return;


  const product =
    list[index];


  if(!product)
    return;


  selectProduct(
    product.id
  );

}


/* =====================================================
   SELECT PRODUCT
===================================================== */

function selectProduct(id){

  const product =
    products.find(
      p =>
        String(p.id) ===
        String(id)
    );


  if(!product)
    return;


  selectedProductData =
    product;


  productSearch.value =
    product.name;


  unitInput.value =
    product.unit;


  /*
     CLOSE POPUP IMMEDIATELY
  */

  productResults
    .classList
    .add("hidden");


  highlightedProductIndex = -1;


  /*
     GO TO QTY
  */

  setTimeout(()=>{

    qtyInput.focus();

    qtyInput.select();

  },50);

}


/* =====================================================
   PRODUCT RESULT CLICK
===================================================== */

productResults.addEventListener(
  "click",
  function(e){

    const row =
      e.target.closest(".result");


    if(!row)
      return;


    const index =
      parseInt(
        row.dataset.index,
        10
      );


    selectProductByIndex(index);

  }
);


/* =====================================================
   PRODUCT SEARCH KEYBOARD
===================================================== */

productSearch.addEventListener(
  "keydown",
  function(e){

    const rows =
      productResults
      .querySelectorAll(".result");


    /*
       DOWN ARROW
    */

    if(e.key === "ArrowDown"){

      e.preventDefault();


      if(
        productResults.classList
        .contains("hidden")
      ){

        searchProducts();

      }


      const current =
        highlightedProductIndex;


      highlightProduct(
        current + 1
      );


      return;

    }


    /*
       UP ARROW
    */

    if(e.key === "ArrowUp"){

      e.preventDefault();


      if(!rows.length)
        return;


      let next =
        highlightedProductIndex - 1;


      if(next < 0){

        next =
          rows.length - 1;

      }


      highlightProduct(next);

      return;

    }


    /*
       ENTER
    */

    if(e.key === "Enter"){

      e.preventDefault();


      if(
        !productResults.classList
        .contains("hidden")
      ){

        if(
          highlightedProductIndex >= 0
        ){

          selectProductByIndex(
            highlightedProductIndex
          );

        }else{

          /*
             If nothing highlighted,
             select first product.
          */

          const first =
            productResults
            .querySelector(".result");


          if(first){

            selectProductByIndex(0);

          }

        }

      }

      return;

    }


    /*
       ESC
    */

    if(e.key === "Escape"){

      e.preventDefault();

      productResults
        .classList
        .add("hidden");

      highlightedProductIndex=-1;

    }

  }
);


/* =====================================================
   SEARCH INPUT
===================================================== */

productSearch.addEventListener(
  "input",
  function(){

    /*
       List opens ONLY when
       user types.
    */

    searchProducts();

  }
);


/* =====================================================
   LIVE AMOUNT
===================================================== */

function liveCalculate(){

  const q =
    parseFloat(
      qtyInput.value
    ) || 0;


  const r =
    parseFloat(
      rateInput.value
    ) || 0;


  liveAmount.textContent =
    (q*r).toFixed(2);

}


qtyInput.addEventListener(
  "input",
  liveCalculate
);


rateInput.addEventListener(
  "input",
  liveCalculate
);


/* =====================================================
   QTY ENTER
===================================================== */

qtyInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      e.preventDefault();

      rateInput.focus();

    }

  }
);


/* =====================================================
   RATE ENTER
===================================================== */

rateInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      e.preventDefault();

      addItem();

    }

  }
);


/* =====================================================
   ADD ITEM
===================================================== */

function addItem(){

  if(!selectedProductData){

    alert(
      "Please select a product"
    );

    productSearch.focus();

    return;

  }


  const q =
    parseFloat(
      qtyInput.value
    );


  const r =
    parseFloat(
      rateInput.value
    );


  if(!q || q<=0){

    alert(
      "Please enter quantity"
    );

    qtyInput.focus();

    return;

  }


  if(isNaN(r) || r<0){

    alert(
      "Please enter rate"
    );

    rateInput.focus();

    return;

  }


  billItems.push({

    productId:
      selectedProductData.id,

    product:
      selectedProductData.name,

    unit:
      selectedProductData.unit,

    qty:
      q,

    rate:
      r,

    amount:
      q*r

  });


  renderItems();


  /*
     RESET
  */

  selectedProductData = null;

  productSearch.value = "";

  unitInput.value = "";

  qtyInput.value = "";

  rateInput.value = "";

  liveAmount.textContent = "0.00";

  productResults
    .classList
    .add("hidden");


  highlightedProductIndex = -1;


  /*
     NEXT PRODUCT
  */

  setTimeout(()=>{

    productSearch.focus();

  },50);

}


/* =====================================================
   RENDER ITEMS
===================================================== */

function renderItems(){

  if(!billItems.length){

    itemsBox.innerHTML =
      `<div class="emptyRow">
        No products added yet
      </div>`;

    calculateTotal();

    return;

  }


  itemsBox.innerHTML =
    billItems
    .map((item,i)=>`

      <div class="billRow">

        <div class="center">
          ${i+1}
        </div>

        <div>
          ${escapeHTML(item.product)}
        </div>

        <div class="right">
          ${Number(item.qty)}
        </div>

        <div>
          ${escapeHTML(item.unit)}
        </div>

        <div class="right">
          ₹${Number(item.rate).toFixed(2)}
        </div>

        <div class="right">
          ₹${Number(item.amount).toFixed(2)}
        </div>

        <div class="center">

          <button
            class="removeBtn"
            onclick="removeItem(${i})">

            ×

          </button>

        </div>

      </div>

    `)
    .join("");


  calculateTotal();

}


/* =====================================================
   REMOVE ITEM
===================================================== */

function removeItem(index){

  billItems.splice(
    index,
    1
  );

  renderItems();

}


/* =====================================================
   TOTAL
===================================================== */

function calculateTotal(){

  const subtotal =
    billItems.reduce(
      (sum,item)=>
        sum +
        Number(item.amount || 0),
      0
    );


  let discount =
    parseFloat(
      discountInput.value
    ) || 0;


  if(discount < 0)
    discount=0;


  if(discount > subtotal)
    discount=subtotal;


  const total =
    subtotal - discount;


  subtotalBox.textContent =
    subtotal.toFixed(2);


  grandTotalBox.textContent =
    total.toFixed(2);

}


discountInput.addEventListener(
  "input",
  calculateTotal
);


/* =====================================================
   SAVE ESTIMATE
===================================================== */

function generateBill(){

  if(!billItems.length){

    alert(
      "Please add at least one product"
    );

    productSearch.focus();

    return;

  }


  const subtotal =
    billItems.reduce(
      (sum,item)=>
        sum +
        Number(item.amount || 0),
      0
    );


  let discount =
    parseFloat(
      discountInput.value
    ) || 0;


  if(discount < 0)
    discount=0;


  if(discount > subtotal)
    discount=subtotal;


  const total =
    subtotal - discount;


  const bill = {

    id:
      editingEstimate ||
      "e_"+Date.now(),

    number:
      estimateNoInput.value,

    date:
      estimateDateInput.value,

    items:
      billItems,

    subtotal:
      subtotal,

    discount:
      discount,

    total:
      total

  };


  if(editingEstimate){

    const index =
      estimates.findIndex(
        x =>
          x.id ===
          editingEstimate
      );


    if(index !== -1){

      estimates[index] =
        bill;

    }

  }else{

    estimates.push(
      bill
    );

  }


  saveEstimates();


  alert(
    editingEstimate
    ? "Estimate updated successfully"
    : "Estimate saved successfully"
  );


  newEstimate();


  showPage("estimates");

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

function saveProduct(){

  const name =
    document
    .getElementById("newProductName")
    .value
    .trim();


  const unit =
    document
    .getElementById("newProductUnit")
    .value;


  if(!name){

    alert(
      "Please enter product name"
    );

    return;

  }


  if(!unit){

    alert(
      "Please select unit"
    );

    return;

  }


  const exists =
    products.some(
      p =>
        p.name
        .toLowerCase() ===
        name.toLowerCase()
    );


  if(exists){

    alert(
      "Product already exists"
    );

    return;

  }


  products.push({

    id:
      "p_"+Date.now(),

    name:
      name,

    unit:
      unit

  });


  saveProducts();


  document
    .getElementById("newProductName")
    .value = "";


  document
    .getElementById("newProductUnit")
    .value = "";


  renderProducts();


  alert(
    "Product saved successfully"
  );

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

  const text =
    productListSearch.value
    .trim()
    .toLowerCase();


  const list =
    products.filter(
      p =>
        p.name
        .toLowerCase()
        .includes(text)
    );


  if(!list.length){

    productList.innerHTML =
      `<div class="empty">
        No products found
      </div>`;

    return;

  }


  productList.innerHTML =
    list
    .map(p=>`

      <div class="listItem">

        <div>

          <div class="listName">

            ${escapeHTML(p.name)}

          </div>

          <div class="badge">

            Unit:
            ${escapeHTML(p.unit)}

          </div>

        </div>


        <div class="actions">

          <button
            class="secondary"
            onclick="editProduct('${p.id}')">

            Edit

          </button>


          <button
            class="danger"
            onclick="deleteProduct('${p.id}')">

            Delete

          </button>

        </div>

      </div>

    `)
    .join("");

}


/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(id){

  const product =
    products.find(
      p =>
        String(p.id) ===
        String(id)
    );


  if(!product)
    return;


  const name =
    prompt(
      "Product Name",
      product.name
    );


  if(name === null)
    return;


  const unit =
    prompt(
      "Unit",
      product.unit
    );


  if(unit === null)
    return;


  if(
    !name.trim() ||
    !unit.trim()
  ){

    alert(
      "Both fields are required"
    );

    return;

  }


  product.name =
    name.trim();

  product.unit =
    unit.trim();


  saveProducts();

  renderProducts();

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

function deleteProduct(id){

  const product =
    products.find(
      p =>
        String(p.id) ===
        String(id)
    );


  if(!product)
    return;


  if(
    !confirm(
      `Delete "${product.name}"?`
    )
  )
    return;


  products =
    products.filter(
      p =>
        String(p.id) !==
        String(id)
    );


  saveProducts();

  renderProducts();

}


/* =====================================================
   RENDER ESTIMATES
===================================================== */

function renderEstimates(){

  const text =
    estimateSearch.value
    .trim()
    .toLowerCase();


  const list =
    estimates
    .slice()
    .reverse()
    .filter(e=>{

      const number =
        String(
          e.number || ""
        )
        .toLowerCase();


      const date =
        String(
          e.date || ""
        )
        .toLowerCase();


      return (
        number.includes(text) ||
        date.includes(text)
      );

    });


  if(!list.length){

    estimateList.innerHTML =
      `<div class="empty">
        No saved estimates
      </div>`;

    return;

  }


  estimateList.innerHTML =
    list
    .map(e=>`

      <div class="listItem">

        <div>

          <div class="listName">

            ${escapeHTML(
              e.number
            )}

          </div>

          <div class="badge">

            ${escapeHTML(
              e.date || ""
            )}

            &nbsp; | &nbsp;

            ${(e.items || []).length}
            product(s)

          </div>

        </div>


        <div>

          <strong>

            ₹${Number(
              e.total || 0
            ).toFixed(2)}

          </strong>

        </div>


        <div class="actions">

          <button
            class="secondary"
            onclick="editEstimate('${e.id}')">

            Edit

          </button>


          <button
            class="danger"
            onclick="deleteEstimate('${e.id}')">

            Delete

          </button>

        </div>

      </div>

    `)
    .join("");

}


/* =====================================================
   EDIT ESTIMATE
===================================================== */

function editEstimate(id){

  const estimate =
    estimates.find(
      e =>
        String(e.id) ===
        String(id)
    );


  if(!estimate)
    return;


  editingEstimate =
    estimate.id;


  estimateNoInput.value =
    estimate.number || "";


  estimateDateInput.value =
    estimate.date || today();


  billItems =
    (estimate.items || [])
    .map(item=>({

      productId:
        item.productId || "",

      product:
        item.product || "",

      unit:
        item.unit || "Nos",

      qty:
        Number(
          item.qty || 0
        ),

      rate:
        Number(
          item.rate ??
          item.price ??
          0
        ),

      amount:
        Number(
          item.amount ??
          (
            Number(item.qty || 0) *
            Number(
              item.rate ??
              item.price ??
              0
            )
          )
        )

    }));


  discountInput.value =
    estimate.discount || 0;


  selectedProductData=null;

  productSearch.value="";

  unitInput.value="";

  qtyInput.value="";

  rateInput.value="";

  liveAmount.textContent="0.00";


  productResults
    .classList
    .add("hidden");


  renderItems();

  showPage("home");

}


/* =====================================================
   DELETE ESTIMATE
===================================================== */

function deleteEstimate(id){

  const estimate =
    estimates.find(
      e =>
        String(e.id) ===
        String(id)
    );


  if(!estimate)
    return;


  if(
    !confirm(
      `Delete ${estimate.number}?`
    )
  )
    return;


  estimates =
    estimates.filter(
      e =>
        String(e.id) !==
        String(id)
    );


  saveEstimates();

  renderEstimates();

}


/* =====================================================
   PRODUCT LIST SEARCH
===================================================== */

productListSearch.addEventListener(
  "input",
  renderProducts
);


/* =====================================================
   ESTIMATE SEARCH
===================================================== */

estimateSearch.addEventListener(
  "input",
  renderEstimates
);


/* =====================================================
   CLOSE POPUP
===================================================== */

document.addEventListener(
  "click",
  function(e){

    if(
      !e.target.closest(".searchWrap")
    ){

      productResults
        .classList
        .add("hidden");

      highlightedProductIndex=-1;

    }

  }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   START
===================================================== */

loadData();


estimateNoInput.value =
  nextEstimateNumber();


estimateDateInput.value =
  today();


renderItems();

renderProducts();

renderEstimates();


/*
   Start on Billing page
*/

showPage("home");

    </script>
